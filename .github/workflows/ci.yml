name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # convex/_generated is committed, so this typechecks against the real
      # generated API/dataModel types without needing `npx convex dev` or a
      # deployment.
      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
